services:
  postgres:
    build:
      context: ./database
    container_name: raqamli-mtt-postgres
    environment:
      POSTGRES_DB: raqamli_mtt
      POSTGRES_USER: raqamli_mtt
      POSTGRES_PASSWORD: raqamli_mtt_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U raqamli_mtt -d raqamli_mtt"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: .
    container_name: raqamli-mtt-backend
    command: ["pnpm", "run", "dev"]
    env_file:
      - ./.env
    environment:
      PORT: 3001
      DATABASE_URL: postgresql://raqamli_mtt:raqamli_mtt_password@postgres:5432/raqamli_mtt
      NO_UPDATE_NOTIFIER: "1"
    ports:
      - "127.0.0.1:3001:3001"
    volumes:
      - backend_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  parent-portal:
    build:
      context: .
    container_name: raqamli-mtt-parent-portal
    command: ["pnpm", "run", "dev:parent-portal"]
    env_file:
      - ./.env
    environment:
      PARENT_PORTAL_PORT: 3002
      DATABASE_URL: postgresql://raqamli_mtt:raqamli_mtt_password@postgres:5432/raqamli_mtt
      NO_UPDATE_NOTIFIER: "1"
    ports:
      - "127.0.0.1:3002:3002"
    volumes:
      - backend_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ../frontend
    container_name: raqamli-mtt-frontend
    command: ["pnpm", "exec", "vite", "--host", "0.0.0.0", "--port", "5000"]
    environment:
      VITE_API_BASE_URL: http://localhost:3001/api
      VITE_PARENT_PORTAL_API_BASE_URL: http://localhost:3002/api
      VITE_PROXY_TARGET: http://backend:3001
      NO_UPDATE_NOTIFIER: "1"
    ports:
      - "127.0.0.1:5000:5000"
    depends_on:
      - backend
      - parent-portal
    restart: unless-stopped

volumes:
  postgres_data:
  backend_uploads:
